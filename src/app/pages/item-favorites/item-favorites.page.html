<ion-header>
  <ion-toolbar>
    <ion-title>Mis favoritos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let fav of favoritos$ | async" (click)="openDetail(fav.id)">
      <ion-thumbnail slot="start">
        <img [src]="fav.imagenUrl" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ fav.nombre }}</h2>
        <p>{{ fav.tipo | titlecase }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
