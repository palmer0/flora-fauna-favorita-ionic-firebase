<ion-header>
  <ion-toolbar>
    <ion-title>Lo Más Elegido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of items$ | async" (click)="openDetail(item.id!)">
      <ion-thumbnail slot="start">
        <img [src]="item.imagenUrl" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ item.nombre }}</h2>
        <p>{{ item.tipo | titlecase }}</p>
        <ion-badge color="success">{{ item.vecesElegido }} votos</ion-badge>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
